version: '3.8'

services:
  # 1. NestJS Backend API
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: automotive_api
    restart: always
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/automotive_os?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super-secret-jwt-key-for-automotive-os-2026
      - JWT_REFRESH_SECRET=super-secret-jwt-refresh-key-for-automotive-os-2026
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=automotive-os
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  # 2. Next.js Web Frontend
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: automotive_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
    depends_on:
      - api

  # 3. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: automotive_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=automotive_os
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: automotive_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 5. MinIO S3-Compatible Storage
  minio:
    image: minio/minio:RELEASE.2024-05-28T07-16-11Z
    container_name: automotive_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
